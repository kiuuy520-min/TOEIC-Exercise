<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas 互動式英文單字卡與複習系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
        }
        .tab-btn.active {
            background-color: #3b82f6;
            color: #ffffff;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3);
        }
        canvas {
            touch-action: manipulation;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col">

    <!-- Header Navigation -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-2">
                <div class="w-9 h-9 rounded-xl bg-blue-600 text-white flex items-center justify-center font-bold text-lg shadow-md">
                    🎴
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight text-slate-900">單字魔法卡 Canvas</h1>
                    <p class="text-xs text-slate-500">多益單字卡 & 互動測驗</p>
                </div>
            </div>

            <!-- Navigation Tabs -->
            <nav class="flex bg-slate-100 p-1 rounded-xl text-sm font-medium">
                <button id="tab-cards" onclick="switchTab('cards')" class="tab-btn active px-4 py-2 rounded-lg transition-all flex items-center gap-1.5">
                    <span>🃏</span> 翻牌單字卡
                </button>
                <button id="tab-quiz" onclick="switchTab('quiz')" class="tab-btn px-4 py-2 rounded-lg transition-all text-slate-600 hover:text-slate-900 flex items-center gap-1.5">
                    <span>📝</span> 測驗複習
                </button>
                <button id="tab-manage" onclick="switchTab('manage')" class="tab-btn px-4 py-2 rounded-lg transition-all text-slate-600 hover:text-slate-900 flex items-center gap-1.5">
                    <span>➕</span> 擴充單字
                </button>
                <button id="tab-list" onclick="switchTab('list')" class="tab-btn px-4 py-2 rounded-lg transition-all text-slate-600 hover:text-slate-900 flex items-center gap-1.5">
                    <span>📋</span> 單字庫 (<span id="total-words-count">0</span>)
                </button>
            </nav>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-4xl mx-auto px-4 py-6 flex-grow w-full">

        <!-- ==================== TAB 1: CANVAS FLASHCARDS ==================== -->
        <section id="section-cards" class="space-y-6">
            <!-- Top Controls & Progress -->
            <div class="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                <div class="flex items-center gap-3">
                    <span id="card-counter" class="text-sm font-semibold text-blue-600 bg-blue-50 px-3 py-1 rounded-full">
                        第 1 / 32 個
                    </span>
                    <button onclick="toggleAutoPlaySpeech()" id="auto-speech-btn" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded-lg transition flex items-center gap-1">
                        🔊 自動讀音: <span id="auto-speech-status" class="font-bold text-emerald-600">開啟</span>
                    </button>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="shuffleCards()" class="text-xs bg-amber-50 hover:bg-amber-100 text-amber-700 font-medium px-3 py-1.5 rounded-lg border border-amber-200 transition flex items-center gap-1">
                        🔀 隨機洗牌
                    </button>
                    <button onclick="resetCardProgress()" class="text-xs text-slate-400 hover:text-slate-600 px-2 py-1">
                        重置順序
                    </button>
                </div>
            </div>

            <!-- Canvas Container -->
            <div class="relative flex flex-col items-center justify-center">
                <div class="relative w-full max-w-lg aspect-[4/3] max-h-[380px]">
                    <canvas id="cardCanvas" class="w-full h-full cursor-pointer rounded-2xl shadow-xl transition-transform active:scale-[0.99]"></canvas>
                </div>
                <p class="text-xs text-slate-400 mt-3 flex items-center gap-1">
                    💡 點擊卡片或按下 <kbd class="px-1.5 py-0.5 bg-slate-200 rounded text-slate-700 font-mono">Space</kbd> 鍵即可翻轉卡片；點擊右上角 🔊 圖示可聽發音
                </p>
            </div>

            <!-- Card Bottom Control Buttons -->
            <div class="flex justify-center items-center gap-4 max-w-md mx-auto pt-2">
                <button onclick="prevCard()" class="flex-1 bg-white hover:bg-slate-50 border border-slate-300 text-slate-700 font-semibold py-3 px-4 rounded-xl shadow-sm transition active:scale-95 flex items-center justify-center gap-2">
                    👈 上一個
                </button>
                <button onclick="playCurrentSpeech()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold p-3.5 rounded-xl shadow-md transition active:scale-95" title="朗讀英文">
                    🔊
                </button>
                <button onclick="nextCard()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl shadow-md transition active:scale-95 flex items-center justify-center gap-2">
                    下一個 👉
                </button>
            </div>
        </section>

        <!-- ==================== TAB 2: QUIZ / REVISION ==================== -->
        <section id="section-quiz" class="hidden space-y-6">
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 text-center max-w-xl mx-auto space-y-6">
                <!-- Quiz Header -->
                <div class="flex justify-between items-center border-b pb-4">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">單字考測驗</span>
                    <span id="quiz-score-badge" class="text-xs font-semibold bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full">
                        得分: 0 / 0
                    </span>
                </div>

                <!-- Quiz Target Word Box -->
                <div id="quiz-box" class="py-6 space-y-3">
                    <div class="inline-block px-3 py-1 bg-blue-50 text-blue-600 text-xs font-semibold rounded-full">
                        請選擇正確的中文意思
                    </div>
                    <div class="flex items-center justify-center gap-3">
                        <h2 id="quiz-question-word" class="text-3xl font-extrabold text-slate-900">
                            Loading...
                        </h2>
                        <button onclick="playQuizSpeech()" class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center hover:bg-blue-200 transition">
                            🔊
                        </button>
                    </div>
                </div>

                <!-- Quiz Options -->
                <div id="quiz-options-container" class="grid grid-cols-1 gap-3 text-left">
                    <!-- Options injected dynamically -->
                </div>

                <!-- Next Question Button -->
                <div id="quiz-feedback" class="hidden py-2 font-medium text-sm"></div>
                <button id="quiz-next-btn" onclick="nextQuizQuestion()" class="hidden w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3 rounded-xl transition">
                    下一題 👉
                </button>
            </div>
        </section>

        <!-- ==================== TAB 3: EXPAND / ADD VOCABULARY ==================== -->
        <section id="section-manage" class="hidden space-y-6">
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-6">
                <div>
                    <h2 class="text-xl font-bold text-slate-900">擴充單字庫</h2>
                    <p class="text-sm text-slate-500 mt-1">您可以貼上新單字快速批次匯入，或單筆新增。</p>
                </div>

                <!-- Batch Import Form -->
                <div class="space-y-3 pt-2 border-t">
                    <label class="block text-sm font-semibold text-slate-700">
                        📦 批次匯入新單字 (每行格式：英文, 中文)
                    </label>
                    <textarea id="import-textarea" rows="5" class="w-full p-3 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none font-mono" placeholder="例：
apple, [名] 蘋果
banana, [名] 香蕉
innovative, [形] 創新的"></textarea>
                    <button onclick="handleBatchImport()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-5 py-2.5 rounded-xl transition shadow-sm text-sm">
                        確認批次匯入
                    </button>
                </div>

                <!-- Single Word Form -->
                <div class="space-y-3 pt-6 border-t">
                    <label class="block text-sm font-semibold text-slate-700">
                        ✏️ 單筆新增單字
                    </label>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <input type="text" id="single-en" placeholder="英文單字/片語 (例: look forward to)" class="p-3 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <input type="text" id="single-zh" placeholder="中文解釋 (例: 期待…)" class="p-3 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <button onclick="handleSingleAdd()" class="bg-slate-900 hover:bg-slate-800 text-white font-semibold px-5 py-2.5 rounded-xl transition text-sm">
                        新增單字
                    </button>
                </div>
            </div>
        </section>

        <!-- ==================== TAB 4: ALL VOCABULARY LIST ==================== -->
        <section id="section-list" class="hidden space-y-4">
            <div class="flex justify-between items-center">
                <input type="text" id="search-input" oninput="renderWordListTable()" placeholder="🔍 搜尋單字或中文..." class="px-4 py-2 border border-slate-300 rounded-xl text-sm w-64 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                <button onclick="resetToDefaultVocab()" class="text-xs text-rose-600 hover:text-rose-800 hover:underline">
                    🔄 還原為預設單字
                </button>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="max-h-[500px] overflow-y-auto">
                    <table class="w-full text-left text-sm border-collapse">
                        <thead class="bg-slate-50 border-b border-slate-200 text-slate-500 sticky top-0">
                            <tr>
                                <th class="p-3 font-semibold">#</th>
                                <th class="p-3 font-semibold">英文單字 / 片語</th>
                                <th class="p-3 font-semibold">中文解釋</th>
                                <th class="p-3 font-semibold text-center">發音</th>
                                <th class="p-3 font-semibold text-center">操作</th>
                            </tr>
                        </thead>
                        <tbody id="word-list-tbody" class="divide-y divide-slate-100">
                            <!-- Injected dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white text-sm px-4 py-3 rounded-xl shadow-xl transition-all opacity-0 translate-y-5 pointer-events-none z-50 flex items-center gap-2">
        <span id="toast-message">訊息通知</span>
    </div>

                saveVocabData();
            }
            cardIndices = vocabList.map((_, idx) => idx);
        }

        function saveVocabData() {
            localStorage.setItem('user_vocab_data_v3', JSON.stringify(vocabList));
            updateTotalCountDisplay();
        }

        function updateTotalCountDisplay() {
            document.getElementById('total-words-count').innerText = vocabList.length;
        }

        function initCanvas() {
            canvas = document.getElementById('cardCanvas');
            ctx = canvas.getContext('2d');

            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            // Canvas Click Listener (Flip Card)
            canvas.addEventListener('click', (e) => {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                // Check if user clicked audio icon in top-right area (approx bounding box)
                const soundBtnRadius = 24;
                const soundBtnX = rect.width - 40;
                const soundBtnY = 40;
                const dist = Math.hypot(x - soundBtnX, y - soundBtnY);

                if (dist <= soundBtnRadius) {
                    playCurrentSpeech();
                } else {
                    flipCard();
                }
            });

            drawCanvasCard();
        }

        function resizeCanvas() {
            if (!canvas) return;
            const container = canvas.parentElement;
            const dpr = window.devicePixelRatio || 1;

            canvas.width = container.clientWidth * dpr;
            canvas.height = container.clientHeight * dpr;

            ctx.scale(dpr, dpr);
            drawCanvasCard();
        }

        function drawCanvasCard() {
            if (!canvas || !ctx || vocabList.length === 0) return;

            const width = canvas.width / (window.devicePixelRatio || 1);
            const height = canvas.height / (window.devicePixelRatio || 1);

            ctx.clearRect(0, 0, width, height);

            const vocab = vocabList[cardIndices[currentCardIndex]];
            if (!vocab) return;

            ctx.save();
            ctx.translate(width / 2, height / 2);

            // Flip Animation Scaling Calculation
            let scaleX = 1;
            if (isFlippingAnimation) {
                scaleX = Math.cos(flipProgress * Math.PI);
            }
            ctx.scale(scaleX, 1);

            // Show front or back side based on flip state
            const isFront = (isFlippingAnimation && flipProgress >= 0.5) ? !isCardFlipped : isCardFlipped;

            // Draw Rounded Card Rectangle Background
            const cardW = width - 20;
            const cardH = height - 20;
            const rx = -cardW / 2;
            const ry = -cardH / 2;

            ctx.shadowColor = 'rgba(15, 23, 42, 0.12)';
            ctx.shadowBlur = 16;
            ctx.shadowOffsetY = 8;

            ctx.beginPath();
            ctx.roundRect(rx, ry, cardW, cardH, 20);
            ctx.fillStyle = isFront ? '#ffffff' : '#f0fdf4'; // Light green tint for back
            ctx.fill();

            // Card Border
            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;
            ctx.lineWidth = 2;
            ctx.strokeStyle = isFront ? '#e2e8f0' : '#bbf7d0';
            ctx.stroke();

            // Top Badge (Front vs Back)
            ctx.fillStyle = isFront ? '#3b82f6' : '#16a34a';
            ctx.font = 'bold 12px Inter, sans-serif';
            ctx.fillText(isFront ? 'ENGLISH' : 'CHINESE / 中文釋義', rx + 24, ry + 36);

            // Sound Speaker Button (Top Right Icon)
            ctx.beginPath();
            ctx.arc(cardW / 2 - 30, ry + 32, 18, 0, Math.PI * 2);
            ctx.fillStyle = '#f1f5f9';
            ctx.fill();
            ctx.font = '16px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🔊', cardW / 2 - 30, ry + 33);

            // Main Text Content
            ctx.textAlign = 'center';

            if (isFront) {
                // Render English Word
                ctx.fillStyle = '#0f172a';
                let fontSize = 32;
                if (vocab.en.length > 20) fontSize = 22;
                else if (vocab.en.length > 14) fontSize = 26;

                ctx.font = `bold ${fontSize}px Inter, sans-serif`;
                ctx.fillText(vocab.en, 0, 10);

                // Bottom Hint
                ctx.fillStyle = '#94a3b8';
                ctx.font = '12px Inter, sans-serif';
                ctx.fillText('點擊任意處翻面 🔄', 0, cardH / 2 - 24);

            } else {
                // Render Chinese Translation
                ctx.fillStyle = '#166534';
                let fontSize = 28;
                if (vocab.zh.length > 15) fontSize = 22;

                ctx.font = `bold ${fontSize}px Inter, sans-serif`;
                ctx.fillText(vocab.zh, 0, -5);

                // Original Word Subtext
                ctx.fillStyle = '#64748b';
                ctx.font = '500 15px Inter, sans-serif';
                ctx.fillText(vocab.en, 0, 30);
            }

            ctx.restore();

            // Update Counter Text Element
            document.getElementById('card-counter').innerText = `第 ${currentCardIndex + 1} / ${vocabList.length} 個`;
        }

        function flipCard() {
            if (isFlippingAnimation) return;

            isFlippingAnimation = true;
            let start = null;
            const duration = 250; // ms

            function animate(timestamp) {
                if (!start) start = timestamp;
                const elapsed = timestamp - start;
                flipProgress = Math.min(elapsed / duration, 1);

                drawCanvasCard();

                if (flipProgress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    isCardFlipped = !isCardFlipped;
                    isFlippingAnimation = false;
                    flipProgress = 0;
                    drawCanvasCard();
                }
            }
            requestAnimationFrame(animate);
        }

        function nextCard() {
            if (vocabList.length === 0) return;
            currentCardIndex = (currentCardIndex + 1) % vocabList.length;
            isCardFlipped = false;
            drawCanvasCard();

            if (autoPlaySpeech) {
                playCurrentSpeech();
            }
        }

        function prevCard() {
            if (vocabList.length === 0) return;
            currentCardIndex = (currentCardIndex - 1 + vocabList.length) % vocabList.length;
            isCardFlipped = false;
            drawCanvasCard();

            if (autoPlaySpeech) {
                playCurrentSpeech();
            }
        }

        function shuffleCards() {
            for (let i = cardIndices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cardIndices[i], cardIndices[j]] = [cardIndices[j], cardIndices[i]];
            }
            currentCardIndex = 0;
            isCardFlipped = false;
            drawCanvasCard();
            showToast('🔀 已隨機打亂單字順序！');
        }

        function resetCardProgress() {
            cardIndices = vocabList.map((_, idx) => idx);
            currentCardIndex = 0;
            isCardFlipped = false;
            drawCanvasCard();
            showToast('已重置為原始排列順序');
        }

        function toggleAutoPlaySpeech() {
            autoPlaySpeech = !autoPlaySpeech;
            const statusEl = document.getElementById('auto-speech-status');
            statusEl.innerText = autoPlaySpeech ? '開啟' : '關閉';
            statusEl.className = autoPlaySpeech ? 'font-bold text-emerald-600' : 'font-bold text-slate-400';
            showToast(autoPlaySpeech ? '🔊 已開啟自動切換讀音' : '🔇 已關閉自動切換讀音');
        }

        function playCurrentSpeech() {
            const vocab = vocabList[cardIndices[currentCardIndex]];
            if (vocab) {
                speakText(vocab.en);
            }
        }

        function speakText(text) {
            if (!('speechSynthesis' in window)) {
                showToast('⚠️ 您的瀏覽器不支援語音播放功能');
                return;
            }

            // Clean up text for clearer TTS pronunciation (remove '...' etc)
            const cleanText = text.replace(/\.\.\./g, '').trim();

            window.speechSynthesis.cancel(); // Stop ongoing speech
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'en-US';
            utterance.rate = 0.9; // Slightly slower for language learners
            window.speechSynthesis.speak(utterance);
        }

        function initQuiz() {
            nextQuizQuestion();
        }

        function nextQuizQuestion() {
            if (vocabList.length < 2) {
                document.getElementById('quiz-question-word').innerText = "單字數量不足，無法開始測驗";
                return;
            }

            // Hide feedback & next button
            document.getElementById('quiz-feedback').className = "hidden py-2 font-medium text-sm";
            document.getElementById('quiz-next-btn').classList.add('hidden');

            // Pick a target item randomly
            const randomIndex = Math.floor(Math.random() * vocabList.length);
            currentQuizItem = vocabList[randomIndex];

            document.getElementById('quiz-question-word').innerText = currentQuizItem.en;

            // Generate 4 multiple choice options (1 correct, 3 distractor)
            const options = [currentQuizItem.zh];
            while (options.length < Math.min(4, vocabList.length)) {
                const distractor = vocabList[Math.floor(Math.random() * vocabList.length)].zh;
                if (!options.includes(distractor)) {
                    options.push(distractor);
                }
            }

            // Shuffle options
            options.sort(() => Math.random() - 0.5);

            // Render option buttons
            const container = document.getElementById('quiz-options-container');
            container.innerHTML = '';

            options.forEach((optText) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 transition font-medium text-slate-700 shadow-sm flex justify-between items-center";
                btn.innerText = optText;
                btn.onclick = () => checkQuizAnswer(optText, btn);
                container.appendChild(btn);
            });

            // Automatically speak word in quiz mode
            playQuizSpeech();
        }

        function playQuizSpeech() {
            if (currentQuizItem) {
                speakText(currentQuizItem.en);
            }
        }

        function checkQuizAnswer(selectedOption, clickedBtn) {
            const allBtns = document.getElementById('quiz-options-container').querySelectorAll('button');
            allBtns.forEach(btn => btn.disabled = true); // Disable further clicks

            quizScore.total++;

            const feedbackEl = document.getElementById('quiz-feedback');
            feedbackEl.classList.remove('hidden');

            if (selectedOption === currentQuizItem.zh) {
                quizScore.correct++;
                clickedBtn.className = "w-full text-left p-4 rounded-xl border-2 border-emerald-500 bg-emerald-50 text-emerald-900 font-bold shadow-sm";
                feedbackEl.innerHTML = '🎉 <span class="text-emerald-600 font-bold">答對了！太棒了！</span>';
            } else {
                clickedBtn.className = "w-full text-left p-4 rounded-xl border-2 border-rose-500 bg-rose-50 text-rose-900 font-bold shadow-sm";
                feedbackEl.innerHTML = `❌ <span class="text-rose-600 font-bold">答錯了！正確答案是：${currentQuizItem.zh}</span>`;

                // Highlight correct one
                allBtns.forEach(btn => {
                    if (btn.innerText === currentQuizItem.zh) {
                        btn.className = "w-full text-left p-4 rounded-xl border-2 border-emerald-500 bg-emerald-50 text-emerald-900 font-bold shadow-sm";
                    }
                });
            }

            // Update Score Badge
            document.getElementById('quiz-score-badge').innerText = `得分: ${quizScore.correct} / ${quizScore.total}`;
            document.getElementById('quiz-next-btn').classList.remove('hidden');
        }

        function handleBatchImport() {
            const textarea = document.getElementById('import-textarea');
            const lines = textarea.value.split('\n');
            let addedCount = 0;

            lines.forEach(line => {
                const parts = line.split(/[,,\t|]/); // Split by comma, tab, or pipe
                if (parts.length >= 2) {
                    const en = parts[0].trim();
                    const zh = parts.slice(1).join(',').trim();
                    if (en && zh) {
                        vocabList.push({ en, zh });
                        addedCount++;
                    }
                }
            });

            if (addedCount > 0) {
                saveVocabData();
                cardIndices = vocabList.map((_, idx) => idx);
                textarea.value = '';
                showToast(`✅ 成功匯入 ${addedCount} 個新單字！`);
                switchTab('list');
            } else {
                showToast('⚠️ 格式不正確，請以「英文, 中文」格式輸入');
            }
        }

        function handleSingleAdd() {
            const enInput = document.getElementById('single-en');
            const zhInput = document.getElementById('single-zh');

            const en = enInput.value.trim();
            const zh = zhInput.value.trim();

            if (!en || !zh) {
                showToast('⚠️ 請填寫完整的英文與中文！');
                return;
            }

            vocabList.push({ en, zh });
            saveVocabData();
            cardIndices = vocabList.map((_, idx) => idx);

            enInput.value = '';
            zhInput.value = '';
            showToast(`✅ 已新增單字: ${en}`);
            switchTab('list');
        }

        function deleteVocabItem(index) {
            const deletedWord = vocabList[index].en;
            vocabList.splice(index, 1);
            saveVocabData();
            cardIndices = vocabList.map((_, idx) => idx);
            if (currentCardIndex >= vocabList.length) {
                currentCardIndex = Math.max(0, vocabList.length - 1);
            }
            renderWordListTable();
            drawCanvasCard();
            showToast(`已刪除: ${deletedWord}`);
        }

        function resetToDefaultVocab() {
            if (confirm('確定要將單字庫重置為預設的單字嗎？（這將會清除您自行擴充的單字）')) {
                vocabList = [...INITIAL_VOCAB];
                saveVocabData();
                cardIndices = vocabList.map((_, idx) => idx);
                currentCardIndex = 0;
                renderWordListTable();
                drawCanvasCard();
                showToast('已還原為預設單字庫！');
            }
        }

        function renderWordListTable() {
            const tbody = document.getElementById('word-list-tbody');
            const searchKeyword = document.getElementById('search-input').value.toLowerCase().trim();

            tbody.innerHTML = '';

            vocabList.forEach((item, index) => {
                if (searchKeyword && !item.en.toLowerCase().includes(searchKeyword) && !item.zh.toLowerCase().includes(searchKeyword)) {
                    return; // Skip if filtered out
                }

                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition border-b border-slate-100";
                tr.innerHTML = `
                    <td class="p-3 text-xs text-slate-400">${index + 1}</td>
                    <td class="p-3 font-semibold text-slate-800">${item.en}</td>
                    <td class="p-3 text-slate-600">${item.zh}</td>
                    <td class="p-3 text-center">
                        <button onclick="speakText('${item.en.replace(/'/g, "\\'")}')" class="p-1.5 rounded-lg bg-slate-100 hover:bg-blue-100 text-blue-600 transition" title="播報發音">
                            🔊
                        </button>
                    </td>
                    <td class="p-3 text-center">
                        <button onclick="deleteVocabItem(${index})" class="text-xs text-rose-500 hover:text-rose-700 px-2 py-1 rounded hover:bg-rose-50">
                            刪除
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function switchTab(tabName) {
            document.querySelectorAll('main > section').forEach(sec => sec.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            document.getElementById(`section-${tabName}`).classList.remove('hidden');
            document.getElementById(`tab-${tabName}`).classList.add('active');

            if (tabName === 'cards') {
                drawCanvasCard();
            } else if (tabName === 'list') {
                renderWordListTable();
            } else if (tabName === 'quiz') {
                nextQuizQuestion();
            }
        }

        function setupEventListeners() {
            // Keyboard shortcut (Space: flip card, Arrow Left/Right: prev/next)
            document.addEventListener('keydown', (e) => {
                // Ignore keypress when typing in text inputs
                if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

                const isCardsVisible = !document.getElementById('section-cards').classList.contains('hidden');
                if (!isCardsVisible) return;

                if (e.code === 'Space') {
                    e.preventDefault();
                    flipCard();
                } else if (e.code === 'ArrowRight') {
                    nextCard();
                } else if (e.code === 'ArrowLeft') {
                    prevCard();
                }
            });
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = message;
            toast.classList.remove('opacity-0', 'translate-y-5', 'pointer-events-none');

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-5', 'pointer-events-none');
            }, 2500);
        }
    </script>
</body>
